<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%}
body{font-family:'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:13px;color:#1a1a1a;background:#c9ced4}
a{color:#005a9e}a:hover{color:#003e6e}
table{border-collapse:collapse}
th,td{padding:5px 9px;border:1px solid #d6d6d6;text-align:left;white-space:nowrap}
th{background:#ececec;font-weight:600}
tbody tr:hover td{background:#e8f1fa}
button:disabled{opacity:.45;cursor:default}
button,input,select{font-family:inherit;font-size:13px}
button:not(:disabled):hover{filter:brightness(.95)}
@keyframes om-bar{from{background-position:0 0}to{background-position:28px 0}}
</style>
</helmet>
<div style="height:100vh;min-height:560px;display:flex;flex-direction:column;background:#c9ced4">
  <div style="height:30px;background:#fafafa;border-bottom:1px solid #c8c8c8;display:flex;align-items:center;justify-content:space-between;padding:0 0 0 12px;flex:none">
    <div style="font-size:12.5px">램프광학 설계정보 및 산출물 통합관리 (PoC)</div>
    <div style="display:flex;color:#444;font-size:13px"><span style="width:44px;text-align:center">─</span><span style="width:44px;text-align:center">☐</span><span style="width:44px;text-align:center">✕</span></div>
  </div>
  <div style="flex:1;position:relative;display:flex;min-height:0;background:#f3f3f3">
    <div style="width:200px;flex:none;border-right:1px solid #c8c8c8;background:#f9f9f9;padding:8px 0;overflow:auto;box-sizing:border-box">
      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="6"><div style="{{ m.style }}" onClick="{{ m.onClick }}">{{ m.label }}</div></sc-for>
    </div>
    <sc-for list="{{ layers }}" as="l" hint-placeholder-count="1">
      <div style="{{ l.wrap }}">
        <div style="{{ l.box }}">
          <sc-if value="{{ l.isModal }}">
            <div style="height:30px;background:#fafafa;border-bottom:1px solid #c8c8c8;display:flex;align-items:center;justify-content:space-between;padding-left:12px;font-weight:600;flex:none">
              <span>{{ l.title }}</span>
              <sc-if value="{{ l.hasClose }}"><span style="width:40px;text-align:center;cursor:pointer" onClick="{{ l.onClose }}">✕</span></sc-if>
            </div>
          </sc-if>
          <sc-if value="{{ l.isPage }}">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 0">
              <div style="font-size:16px;font-weight:600">{{ l.title }}</div>
              <sc-if value="{{ l.hasBack }}"><button style="height:26px;padding:0 12px;background:#fdfdfd;border:1px solid #8a8a8a;border-radius:3px;cursor:pointer" onClick="{{ l.onBack }}">{{ l.backLabel }}</button></sc-if>
            </div>
          </sc-if>
          <div style="{{ l.inner }}">
            <sc-for list="{{ l.sections }}" as="s">
              <div style="{{ s.wrap }}">
                <sc-if value="{{ s.hasTitle }}"><div style="font-weight:600;margin-bottom:8px">[ {{ s.title }} ]</div></sc-if>
                <sc-if value="{{ s.isForm }}">
                  <div style="{{ s.fStyle }}">
                    <sc-for list="{{ s.fields }}" as="f">
                      <div style="{{ f.rowStyle }}">
                        <sc-if value="{{ f.hasLabel }}"><label style="{{ f.lblStyle }}">{{ f.labelText }}</label></sc-if>
                        <div style="min-width:0">
                          <sc-if value="{{ f.isText }}"><input type="text" value="{{ f.value }}" onChange="{{ f.onChange }}" disabled="{{ f.ro }}" style="{{ f.inStyle }}"></sc-if>
                          <sc-if value="{{ f.isPass }}"><input type="password" value="{{ f.value }}" onChange="{{ f.onChange }}" style="{{ f.inStyle }}"></sc-if>
                          <sc-if value="{{ f.isDate }}"><input type="date" value="{{ f.value }}" onChange="{{ f.onChange }}" style="{{ f.inStyle }}"></sc-if>
                          <sc-if value="{{ f.isSelect }}"><select value="{{ f.value }}" onChange="{{ f.onChange }}" disabled="{{ f.ro }}" style="{{ f.inStyle }}"><sc-for list="{{ f.options }}" as="o"><option value="{{ o.v }}">{{ o.t }}</option></sc-for></select></sc-if>
                          <sc-if value="{{ f.isCheck }}"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" checked="{{ f.checked }}" onChange="{{ f.onChange }}" disabled="{{ f.ro }}">{{ f.checkText }}</label></sc-if>
                          <sc-if value="{{ f.isStatic }}"><div style="padding-top:4px">{{ f.value }}</div></sc-if>
                          <sc-if value="{{ f.hasErr }}"><div style="color:#b42318;font-size:12.5px;margin-top:3px">✖ {{ f.error }}</div></sc-if>
                          <sc-if value="{{ f.hasHint }}"><div style="color:#5c5c5c;font-size:12px;margin-top:3px">{{ f.hint }}</div></sc-if>
                        </div>
                      </div>
                    </sc-for>
                    <sc-if value="{{ s.hasTrail }}"><div style="margin-left:auto;color:#333">{{ s.trail }}</div></sc-if>
                  </div>
                </sc-if>
                <sc-if value="{{ s.isKv }}">
                  <div style="display:grid;grid-template-columns:120px minmax(0,1fr);gap:5px 10px;font-size:12.5px">
                    <sc-for list="{{ s.lines }}" as="m"><div style="color:#5c5c5c">{{ m.k }}</div><div style="{{ m.vs }}">{{ m.v }}</div></sc-for>
                  </div>
                </sc-if>
                <sc-if value="{{ s.isText }}">
                  <div style="display:flex;flex-direction:column;gap:3px"><sc-for list="{{ s.lines }}" as="m"><div style="{{ m.ts }}">{{ m.t }}</div></sc-for></div>
                </sc-if>
                <sc-if value="{{ s.isBox }}">
                  <div style="{{ s.boxStyle }}">
                    <div style="font-weight:600">{{ s.head }}</div>
                    <sc-for list="{{ s.lines }}" as="m"><div style="{{ m.ts }}">{{ m.t }}</div></sc-for>
                    <sc-if value="{{ s.busy }}"><div style="height:8px;margin-top:4px;border:1px solid #8a8a8a;background:repeating-linear-gradient(90deg,#0067c0 0 14px,#fff 14px 28px);animation:om-bar .6s linear infinite"></div></sc-if>
                  </div>
                </sc-if>
                <sc-if value="{{ s.isTable }}">
                  <div style="border:1px solid #adadad;background:#fff;overflow:auto;max-width:100%">
                    <table style="width:100%;font-size:12.5px">
                      <thead><tr><sc-for list="{{ s.cols }}" as="c"><th>{{ c.h }}</th></sc-for></tr></thead>
                      <tbody>
                        <sc-for list="{{ s.rows }}" as="r">
                          <tr style="{{ r.style }}" onClick="{{ r.onClick }}">
                            <sc-for list="{{ r.cells }}" as="c">
                              <td style="{{ c.style }}">
                                <sc-if value="{{ c.hasBtn }}"><button style="height:22px;padding:0 10px;background:#fdfdfd;border:1px solid #8a8a8a;border-radius:3px;cursor:pointer" onClick="{{ c.onBtn }}">{{ c.btn }}</button></sc-if>
                                <sc-if value="{{ c.noBtn }}">{{ c.t }}</sc-if>
                              </td>
                            </sc-for>
                          </tr>
                        </sc-for>
                      </tbody>
                    </table>
                    <sc-if value="{{ s.isEmpty }}"><div style="padding:18px;text-align:center;color:#5c5c5c">{{ s.empty }}</div></sc-if>
                  </div>
                </sc-if>
                <sc-if value="{{ s.isBtns }}">
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
                    <div style="display:flex;gap:8px;flex-wrap:wrap"><sc-for list="{{ s.left }}" as="b"><button style="{{ b.style }}" disabled="{{ b.disabled }}" onClick="{{ b.onClick }}">{{ b.label }}</button></sc-for></div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap"><sc-for list="{{ s.right }}" as="b"><button style="{{ b.style }}" disabled="{{ b.disabled }}" onClick="{{ b.onClick }}">{{ b.label }}</button></sc-for></div>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="height:28px;flex:none;background:#fafafa;border-top:1px solid #c8c8c8;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 12px;font-size:12.5px">
    <div style="display:flex;gap:14px"><span>{{ userText }}</span><span>서버: {{ serverText }}</span><span>DB: {{ dbText }}</span></div>
    <button style="height:22px;padding:0 12px;background:#fdfdfd;border:1px solid #8a8a8a;border-radius:3px;cursor:pointer" disabled="{{ noUser }}" onClick="{{ logout }}">로그아웃</button>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const INK='#1a1a1a',MUT='#5c5c5c',OK='#1e7a34',ERR='#b42318',WARN='#8a5a00';
const FILES=[
 {n:'headlamp_sim_v3.xmp',s:12582912},
 {n:'rear_beam_pattern.pf',s:4718592},
 {n:'광학 해석 보고서.pdf',s:3145728},
 {n:'review_notes.docx',s:88000},
 {n:'empty_log.txt',s:0},
 {n:'headlamp_sim_v3_전송손상.xmp',s:12582912,bad:true}
];
const KINDS=['시뮬레이션결과','측정결과','검토서','도면','기타'];
const STAGES=['개념','DV','PV'];
const hx=s=>{let h=2166136261,o='';for(let i=0;o.length<64;i++){h^=s.charCodeAt(i%s.length)+i;h=Math.imul(h,16777619)>>>0;o+=h.toString(16).padStart(8,'0');}return o.slice(0,64);};
const fmt=b=>b>=1048576?(b/1048576).toFixed(2)+' MB':b>=1024?(b/1024).toFixed(1)+' KB':b+' B';
const num=n=>n.toLocaleString('en-US');
const now=()=>{const d=new Date();return '2027-05-12 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const V=(id,ver,file,size,by,at)=>({id,ver,file,size,sha:hx(file+size),by,at,active:true});
const OPLBL={LOGIN_SUCCESS:'로그인 성공',LOGIN_FAIL:'로그인 실패',LOGOUT:'로그아웃',FILE_UPLOAD:'파일 등록',FILE_DOWNLOAD:'파일 다운로드',ACCESS_DENIED:'권한 거부',SYSTEM_ERROR:'시스템 오류'};
const ROLE={ADMIN:'관리자',USER:'일반 사용자'};
const P=(id,name,code,lamp,phase,owner,created,params)=>({id,name,code,lamp,phase,owner,note:'',active:true,created,params:params||{d:'',o:'',m:'',n:'',f5:'',f6:'',f7:'',f8:'',f9:'',f10:''}});

class Component extends DCLogic {
  state={
    screen:'login',user:null,pid:null,aid:null,vid:null,row:null,modal:null,confirm:null,msg:null,nid:100,
    projects:[
      P(1,'XX차종 헤드램프','XX-HL','헤드램프','DV','홍길동','2027-03-10 10:00',{d:'A타입',o:'리플렉터',m:'XX사',n:'24',f5:'',f6:'',f7:'',f8:'',f9:'',f10:''}),
      P(2,'YY차종 리어램프','YY-RL','리어램프','PV','김철수','2027-03-15 09:30'),
      P(3,'ZZ차종 DRL','ZZ-DR','DRL','개념','홍길동','2027-04-01 14:00')],
    assets:[
      {id:1,name:'헤드램프 광학 시뮬레이션 결과',pid:1,kind:'시뮬레이션결과',stage:'DV',active:true,latest:12,versions:[V(12,'v2','headlamp_sim_v2.xmp',10485760,'홍길동','2027-04-10 11:00'),V(11,'v1','headlamp_sim.xmp',10244000,'홍길동','2027-04-01 09:00')]},
      {id:2,name:'리어램프 배광 측정',pid:2,kind:'측정결과',stage:'PV',active:true,latest:null,versions:[V(21,'v1','rear_meas.xlsx',2516582,'김철수','2027-04-05 16:10')]},
      {id:3,name:'광학 설계 검토서',pid:1,kind:'검토서',stage:'DV',active:true,latest:31,versions:[V(31,'v1','optics_review.pdf',3250585,'홍길동','2027-03-28 13:20')]},
      {id:4,name:'구 광학 검토서',pid:1,kind:'검토서',stage:'DV',active:false,latest:41,off:'2027-04-12 15:20',offBy:'홍길동',versions:[V(41,'v1','old_review.pdf',1887436,'홍길동','2027-03-12 10:00')]}],
    users:[{id:'admin',name:'관리자',role:'ADMIN',active:true,at:'2027-03-01'},{id:'designer01',name:'홍길동',role:'USER',active:true,at:'2027-03-01'},{id:'designer02',name:'김철수',role:'USER',active:true,at:'2027-03-05'}],
    exts:['xmp','pf','pdf','pptx','xlsx','txt','zip','jpg','png'].map(e=>({ext:e,active:true})),
    logs:[
      {at:'2027-05-12 09:00',u:'designer01',op:'LOGIN_SUCCESS',t:'designer01',ok:true},
      {at:'2027-05-12 09:05',u:'designer02',op:'LOGIN_FAIL',t:'designer02',ok:false,code:'E-AUTH-401',msg:'인증 실패'},
      {at:'2027-05-12 09:20',u:'designer01',op:'FILE_DOWNLOAD',t:'ver=12',ok:true}].reverse(),
    ui:{prjQ:'',off:false,aF:'all',sk:'date',sd:'desc',sq:{name:'',p:'all',k:'all',from:'',to:''},applied:null,sErr:'',ext:'',extErr:''},
    lf:{id:'',pw:''},lerr:null,pf:{},pe:{},df:{},de:{},up:null,uf:{},ue:{}
  };
  go=(screen,x={})=>this.setState(s=>({screen,msg:null,row:null,modal:null,confirm:null,ui:{...s.ui,sk:'date',sd:'desc'},...x}));
  ui=k=>e=>{const v=e.target.type==='checkbox'?e.target.checked:e.target.value;this.setState(s=>({ui:{...s.ui,[k]:v}}));};
  sq=k=>e=>{const v=e.target.value;this.setState(s=>({ui:{...s.ui,sq:{...s.ui.sq,[k]:v}}}));};
  frm=(f,k)=>e=>{const v=e.target.type==='checkbox'?e.target.checked:e.target.value;this.setState(s=>({[f]:{...s[f],[k]:v}}));};
  log=(op,t,ok=true,code='',msg='')=>this.setState(s=>({logs:[{at:now(),u:s.user?s.user.id:'-',op,t,ok,code,msg},...s.logs]}));
  ok=text=>this.setState({msg:{k:'ok',text}});
  fld(label,value,onChange,o={}){const k=o.k||'text',inl=o.inl;
    return {label,labelText:label+(o.req?' *':''),hasLabel:!!label&&k!=='check',value:value??'',onChange,checked:!!value,checkText:label,
      isText:k==='text',isPass:k==='pass',isDate:k==='date',isSelect:k==='select',isCheck:k==='check',isStatic:k==='static',
      options:(o.opts||[]).map(x=>typeof x==='string'?{v:x,t:x}:x),ro:!!o.ro,error:o.err||'',hasErr:!!o.err,hint:o.hint||'',hasHint:!!o.hint,
      rowStyle:inl?'display:flex;align-items:center;gap:6px':'display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:start',
      lblStyle:'font-size:13px;'+(inl?'':'padding-top:4px'),
      inStyle:'height:26px;border:1px solid '+(o.err?ERR:'#8a8a8a')+';background:'+(o.ro?'#ececec':'#fff')+';padding:0 6px;color:#1a1a1a;box-sizing:border-box;width:'+(o.w||(inl?'180px':'100%'))+';max-width:100%'};}
  L=a=>a.map(m=>typeof m==='string'?{t:m,ts:'font-size:12.5px'}:{...m,ts:'font-size:12.5px;'+(m.color?'color:'+m.color+';':'')+(m.bold?'font-weight:600':'')});
  KV=a=>a.map(([k,v,x])=>({k,v,vs:'word-break:break-all;'+(x&&x.mono?'font-family:Consolas,monospace;font-size:12px;':'')+(x&&x.color?'color:'+x.color+';font-weight:600':'')}));
  S(kind,o={}){const bd=o.title&&['form','kv','text'].includes(kind);
    return {isForm:kind==='form',isKv:kind==='kv',isText:kind==='text',isBox:kind==='box',isTable:kind==='table',isBtns:kind==='btns',
      title:o.title||'',hasTitle:!!o.title,wrap:bd?'border:1px solid #c8c8c8;background:#fcfcfc;padding:10px 12px':'',
      fStyle:o.inline?'display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px':'display:flex;flex-direction:column;gap:8px',hasTrail:!!o.trail,...o};}
  form=(title,fields,o={})=>this.S('form',{title,fields,...o});
  kv=(title,a)=>this.S('kv',{title,lines:this.KV(a)});
  txt=(title,a)=>this.S('text',{title,lines:this.L(a)});
  box=(c,head,lines,busy)=>this.S('box',{head,lines:this.L(lines),busy:!!busy,boxStyle:'border:1px solid '+c+';background:'+({[OK]:'#f1f8f3',[ERR]:'#fdf2f1',[WARN]:'#fff8e8'}[c]||'#f3f3f3')+';padding:9px 12px;display:flex;flex-direction:column;gap:3px;color:'+INK});
  tbl(title,cols,rows,empty){return this.S('table',{title,cols:cols.map(h=>({h})),empty,isEmpty:!rows.length,
    rows:rows.map(r=>({onClick:r.onClick,style:(r.sel?'background:#cce4f7;':'')+(r.onClick?'cursor:pointer':''),
      cells:r.cells.map(c=>({t:String(c.t??''),hasBtn:!!c.btn,noBtn:!c.btn,btn:c.btn,onBtn:c.onBtn,style:(c.color?'color:'+c.color+';':'')+(c.bold?'font-weight:600;':'')+(r.sel?'background:#cce4f7':'')}))}))});}
  btn=(label,onClick,o={})=>({label,onClick,disabled:!!o.d,style:'height:28px;padding:0 16px;border-radius:3px;cursor:pointer;'+({p:'background:#0067c0;color:#fff;border:1px solid #005a9e',c:'background:#fff;color:#a4262c;border:1px solid #a4262c'}[o.k]||'background:#fdfdfd;color:#1a1a1a;border:1px solid #8a8a8a')});
  btns=(left,right)=>this.S('btns',{left,right});
  sortFlds=(nameLbl)=>{const u=this.state.ui;return [this.fld('정렬',u.sk,this.ui('sk'),{k:'select',inl:1,w:'110px',opts:[{v:'date',t:'등록일'},{v:'name',t:nameLbl}]}),this.fld('',u.sd,this.ui('sd'),{k:'select',inl:1,w:'100px',opts:[{v:'desc',t:'내림차순'},{v:'asc',t:'오름차순'}]})];};
  sortL=(arr,dt,nm)=>{const {sk,sd}=this.state.ui;const g=sk==='name'?nm:dt;return [...arr].sort((a,b)=>(g(a)>g(b)?1:g(a)<g(b)?-1:0)*(sd==='asc'?1:-1));};

  latestLbl=a=>{const v=this.lastOf(a);return v?'★ '+v.ver:'(미지정)';};
  fileOf=a=>(this.lastOf(a)||a.versions[0]).file;
  extOf=n=>n.includes('.')?n.split('.').pop().toLowerCase():'';
  pname=id=>{const p=this.state.projects.find(x=>x.id===id);return p?p.name:'';};
  allowedTxt=()=>this.state.exts.filter(e=>e.active).map(e=>e.ext).join(', ');
  ask=c=>this.setState({confirm:c});
  download=(file,ver)=>{this.log('FILE_DOWNLOAD','ver='+ver);this.ok('다운로드 완료: '+file);};

  // ---- actions
  doLogin=()=>{const {lf,users}=this.state;const u=users.find(x=>x.id===lf.id.trim());
    if(!u||!lf.pw){this.setState({lerr:'로그인에 실패했습니다. 입력 정보를 확인하십시오',lf:{...lf,pw:''}});this.setState(s=>({logs:[{at:now(),u:lf.id.trim()||'-',op:'LOGIN_FAIL',t:lf.id.trim(),ok:false,code:'E-AUTH-401',msg:'인증 실패'},...s.logs]}));return;}
    if(!u.active){this.setState({lerr:'로그인에 실패했습니다. 관리자에게 문의하십시오',lf:{...lf,pw:''}});return;}
    this.setState(s=>({user:u,lerr:null,lf:{id:'',pw:''},logs:[{at:now(),u:u.id,op:'LOGIN_SUCCESS',t:u.id,ok:true},...s.logs]}));this.go('prj');};

  openPrj=id=>{const p=this.state.projects.find(x=>x.id===id);this.go('prjDetail',{pid:id,pf:{name:p.name,code:p.code,lamp:p.lamp,phase:p.phase,owner:p.owner,note:p.note},pe:{}});};

  savePrj=()=>{const {pf,pid,projects}=this.state;const e={};
    if(!pf.name.trim())e.name='프로젝트명: 필수 항목입니다. 프로젝트명을 입력하십시오';
    else if(projects.some(p=>p.name===pf.name.trim()&&p.id!==pid))e.name='동일한 프로젝트명이 이미 존재합니다. 다른 프로젝트명을 입력하십시오';
